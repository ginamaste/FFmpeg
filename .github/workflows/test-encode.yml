name: Benchmark Encode

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Remote file path (e.g. storage:Twitch/... or channel/folder/part.ts)'
        required: true
        type: string
      ffmpeg_args:
        description: 'FFmpeg encoding parameters'
        required: false
        default: '-c:v libx264 -crf 23 -preset veryfast -c:a aac -b:a 128k'
        type: string
      duration:
        description: 'Test duration in seconds (0 for full file)'
        required: false
        default: '60'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Setup environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rclone ffmpeg

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          CONF="${RCLONE_CONF}"
          if echo "$CONF" | grep -qv '\['; then
            CONF=$(echo "$CONF" | base64 -d 2>/dev/null || echo "$CONF")
          fi

          if echo "$CONF" | grep -q '"type": *"service_account"'; then
            echo "$CONF" > /tmp/sa.json
            printf "[gdrive]\ntype = drive\nscope = drive\nservice_account_file = /tmp/sa.json\n\n[storage]\ntype = alias\nremote = gdrive:\n" > ~/.config/rclone/rclone.conf
          else
            echo "$CONF" | tr -d '\r' > ~/.config/rclone/rclone.conf
            REMOTE=$(grep -m 1 -o '\[.*\]' ~/.config/rclone/rclone.conf | head -n 1 | tr -d '[]\r')
            if [ -n "$REMOTE" ] && [ "$REMOTE" != "storage" ] && ! grep -q "\[storage\]" ~/.config/rclone/rclone.conf; then
              printf "\n[storage]\ntype = alias\nremote = %s:\n" "$REMOTE" >> ~/.config/rclone/rclone.conf
            fi
          fi

      - name: Encode and upload
        run: |
          INPUT_PATH="${{ inputs.file_path }}"
          FFMPEG_ARGS="${{ inputs.ffmpeg_args }}"
          DURATION="${{ inputs.duration }}"

          if [[ "$INPUT_PATH" != *":"* ]]; then
            REMOTE_SRC="storage:Twitch/${INPUT_PATH#/}"
          else
            REMOTE_SRC="$INPUT_PATH"
          fi

          REMOTE_DIR=$(dirname "$REMOTE_SRC")
          FILENAME=$(basename "$REMOTE_SRC")
          BASENAME="${FILENAME%.*}"

          WORK_DIR="/tmp/bench"
          mkdir -p "$WORK_DIR"
          LOCAL_IN="${WORK_DIR}/${FILENAME}"
          LOCAL_OUT="${WORK_DIR}/${BASENAME}_encoded.mp4"

          echo "Downloading $REMOTE_SRC"
          rclone copyto "$REMOTE_SRC" "$LOCAL_IN" --drive-chunk-size 64M

          TIME_OPT=""
          if [ -n "$DURATION" ] && [ "$DURATION" -gt 0 ] 2>/dev/null; then
            TIME_OPT="-t $DURATION"
          fi

          echo "Encoding: ffmpeg $TIME_OPT -i $FILENAME $FFMPEG_ARGS"
          START_TS=$(date +%s)
          ffmpeg -nostdin -y -hide_banner $TIME_OPT -i "$LOCAL_IN" $FFMPEG_ARGS -movflags +faststart "$LOCAL_OUT"
          END_TS=$(date +%s)

          IN_BYTES=$(stat -c%s "$LOCAL_IN" 2>/dev/null || stat -f%z "$LOCAL_IN")
          OUT_BYTES=$(stat -c%s "$LOCAL_OUT" 2>/dev/null || stat -f%z "$LOCAL_OUT")
          ELAPSED=$(( END_TS - START_TS ))

          echo "Finished in ${ELAPSED}s. Input: $(( IN_BYTES / 1048576 ))MB, Output: $(( OUT_BYTES / 1048576 ))MB"

          echo "Uploading output to $REMOTE_DIR"
          rclone copyto "$LOCAL_OUT" "${REMOTE_DIR}/${BASENAME}_encoded.mp4" --drive-chunk-size 64M
          rm -rf "$WORK_DIR"
