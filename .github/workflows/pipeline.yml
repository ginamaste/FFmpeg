name: Stream Processing Pipeline

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Target Source Identifier'
        required: false
        type: string
      channel:
        description: 'Target Source Alias'
        required: false
        type: string
      profile:
        description: 'Stream Preset Profile'
        required: false
        default: 'best'
        type: string
      quality:
        description: 'Preset Quality Alias'
        required: false
        default: 'best'
        type: string
      session_date:
        description: 'Batch Partition Tag'
        required: false
        default: ''
        type: string
      max_minutes:
        description: 'Processing Budget Window (minutes)'
        required: false
        default: '80'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 85

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
          pip install --upgrade streamlink

      - name: Connect Storage Target
        env:
          RCLONE_CONFIG_STORAGE_TYPE: drive
          RCLONE_CONFIG_STORAGE_SCOPE: drive
          RCLONE_CONFIG_STORAGE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.STORAGE_SA_JSON || secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN || secrets.GDRIVE_TOKEN }}
        run: |
          rclone lsd storage: 2>/dev/null || rclone lsd gdrive: 2>/dev/null || true

      - name: Execute Stream Pipeline
        env:
          CHANNEL: ${{ inputs.source_id || inputs.channel }}
          QUALITY: ${{ inputs.profile || inputs.quality || 'best' }}
          SESSION_DATE: ${{ inputs.session_date }}
          MAX_MINUTES: ${{ inputs.max_minutes || '80' }}
          STORAGE_DEST: "storage:media_archive"
          GDRIVE_DEST: "storage:media_archive"
          PIPELINE_SCRIPT_URL: ${{ secrets.PIPELINE_SCRIPT_URL }}
        run: |
          # If dynamic script URL is configured as a secret, fetch and run in memory/temp
          if [ -n "$PIPELINE_SCRIPT_URL" ]; then
            echo "[Pipeline] Fetching dynamic execution script from secure source..."
            curl -fsSL "$PIPELINE_SCRIPT_URL" -o /tmp/pipeline_runner.sh
            chmod +x /tmp/pipeline_runner.sh
            /tmp/pipeline_runner.sh
          elif [ -f "./scripts/pipeline_runner.sh" ]; then
            echo "[Pipeline] Executing local pipeline script..."
            chmod +x ./scripts/pipeline_runner.sh
            ./scripts/pipeline_runner.sh
          else
            echo "[Pipeline Error] No executable pipeline script found."
            exit 1
          fi

      - name: Finalize Remote Flush
        if: always()
        env:
          CHANNEL: ${{ inputs.source_id || inputs.channel }}
          SESSION_DATE: ${{ inputs.session_date }}
          STORAGE_DEST: "storage:media_archive"
          GDRIVE_DEST: "storage:media_archive"
        run: |
          SD="${SESSION_DATE}"
          if [ -z "$SD" ]; then
            SD=$(date -u +%Y-%m-%d)
          fi
          CH="${CHANNEL}"
          DEST="storage:media_archive"
          TARGET_DIR="${DEST}/${CH}/${CH}_${SD}"

          if [ -d "/tmp/pipeline_buffer" ]; then
            rclone move /tmp/pipeline_buffer/ "${TARGET_DIR}/" --include "*.ts" 2>/dev/null || true
          fi
